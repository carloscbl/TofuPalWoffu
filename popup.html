<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TofuPalWoffu</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <main class="container">
    <section class="config">
      <h1>Configuracion</h1>
      <form id="config-form">
        <div class="field">
          <label for="baseUrl">Base URL</label>
          <input id="baseUrl" name="baseUrl" type="url" required placeholder="https://empresa.woffu.com">
        </div>
        <div class="field">
          <label for="userId">User ID</label>
          <input id="userId" name="userId" type="number" min="1" required>
        </div>
        <div class="field">
          <label for="bearerToken">Bearer token</label>
          <textarea id="bearerToken" name="bearerToken" rows="3" placeholder="Pega aquí tu token JWT"></textarea>
        </div>
        <div class="field">
          <label for="defaultComments">Comentario</label>
          <input id="defaultComments" name="defaultComments" type="text" placeholder="Opcional">
        </div>
        <div class="field">
          <label for="utcOffset">Offset respecto UTC (minutos)</label>
          <input id="utcOffset" name="utcOffset" type="number" step="1" value="120">
          <span class="hint">Ejemplo: Madrid en horario de verano = 120</span>
        </div>
        <fieldset class="slots">
          <legend>Bloques horarios (Lunes-Jueves)</legend>
          <div id="slot-list"></div>
          <button type="button" id="add-slot">Anadir bloque</button>
        </fieldset>
        <fieldset class="slots">
          <legend>Bloques horarios (Viernes)</legend>
          <div id="friday-slot-list"></div>
          <button type="button" id="add-friday-slot">Anadir bloque</button>
        </fieldset>
        <fieldset class="toggles">
          <legend>Modo envio</legend>
          <label class="toggle">
            <input id="dryRun" name="dryRun" type="checkbox" checked>
            <span>Modo dry-run (no envia PUT)</span>
          </label>
        </fieldset>
      </form>
    </section>

    <section class="month-picker">
      <h2>Datos del mes</h2>
      <div class="field inline">
        <label for="month">Mes</label>
        <input id="month" name="month" type="month">
      </div>
      <button id="load-month" class="secondary">Cargar registros</button>
    </section>

    <section class="pending-days">
  <h2>Dias pendientes</h2>
      <table id="pending-table">
        <thead>
          <tr>
            <th>
              <input type="checkbox" id="select-all" checked>
            </th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Diferencia</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="pending-body">
          <tr class="empty">
            <td colspan="5">Sin datos cargados.</td>
          </tr>
        </tbody>
      </table>
      <div class="actions">
  <button id="preview-single" class="secondary">Previsualizar dia</button>
        <button id="preview-multi" class="secondary">Previsualizar selección</button>
        <button id="send-selection" class="primary">Enviar selección</button>
      </div>
    </section>

    <section class="preview">
  <h2>Vista previa</h2>
  <pre id="preview-output">Selecciona dias para ver la carga simulada.</pre>
    </section>
  </main>
  <script type="module" src="scripts/popup.js"></script>
</body>
</html>
